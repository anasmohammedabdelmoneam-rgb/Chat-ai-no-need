<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Chat AI Pro - استكشف المحادثات ما بعد النجوم</title>
    <!-- روابط التصميم والخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white overflow-x-hidden">

    <!-- خلفية النجوم المتحركة -->
    <canvas id="space-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- الواجهة الرئيسية -->
    <div id="root" class="relative z-10 flex flex-col items-center justify-center min-h-screen p-4 text-center">
        
        <!-- الأيقونة العليا -->
        <div class="mb-6 p-3 rounded-2xl bg-blue-950/40 border border-blue-500/30 shadow-lg shadow-blue-500/20 icon-glow floaty">
            <div class="w-16 h-16 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-3xl font-bold">
                🤖
            </div>
        </div>

        <!-- عنوان التطبيق -->
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-wider font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 text-glow mb-2">
            Chat AI Pro
        </h1>
        <p class="text-xs md:text-sm tracking-widest text-cyan-300/70 font-mono uppercase mb-8">
            YOUR AI. IN ORBIT.
        </p>

        <!-- حاوية رمز الـ QR -->
        <div class="p-4 rounded-3xl bg-blue-950/20 border border-cyan-500/40 shadow-2xl shadow-cyan-500/20 backdrop-blur-md relative group mb-6">
            <div class="absolute inset-0 rounded-3xl border border-cyan-400/20 animate-pulse pointer-events-none"></div>
            <!-- رمز QR سيتم توليده بالجافاسكريبت -->
            <div id="qrcode-container" class="bg-white p-3 rounded-2xl flex items-center justify-center"></div>
        </div>

        <!-- النصوص التوجيهية -->
        <p class="text-sm font-bold tracking-widest text-cyan-400 uppercase mb-2">
            SCAN TO USE THE APP
        </p>
        <p class="text-xs text-gray-400">
            Scan the QR code to get started.
        </p>
    </div>

    <!-- مكتبة توليد الـ QR وسكربت التطبيق -->
    <script src="https://cdnjs.cloudflare.com/ajax5/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="java.js"></script>
</body>
</html>
